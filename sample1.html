<html>
   <head>
   
      <script type="text/javascript">
         
            function over() {
               document.write ("Mouse Over");
            }
            
            function out() {
               document.write ("Mouse Out");
            }
                  
      </script>
        </head>
   <body>
      <p>Bring your mouse inside the division to see the result:</p>
      
      <div >
         <button onmouseover="over()" onmouseleave="out()"> This is inside the division </button>
      </div>
         
   </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div with iframe-like functionality</title>
    <script>
        // Function to load content into a div
        function loadContent(url, targetDiv) {
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    document.getElementById(targetDiv).innerHTML = this.responseText;
                }
            };
            xhttp.open("GET", url, true);
            xhttp.send();
        }
    </script>
</head>
<body>

<!-- Navigation buttons to load content into the "contentDiv" -->
<button onclick="loadContent('css_page.html', 'contentDiv')">Load Page 1</button>
<button onclick="loadContent('page2.html', 'contentDiv')">Load Page 2</button>

<!-- The div where the external content will be loaded -->
<div id="contentDiv">
    <!-- Initial content or leave it empty -->
    <p>Initial content goes here.</p>
</div>

</body>
</html>
